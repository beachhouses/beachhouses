name: Generate Pacman

on:
schedule:
- cron: "0 */12 * * *"
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: generate pacman
    uses: Platane/snk@v3
    with:
      github_user_name: beachhouses
      outputs: |
        output/pacman-contribution-graph.svg

  - name: push
    uses: crazy-max/ghaction-github-pages@v3
    with:
      target_branch: output
      build_dir: output
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
